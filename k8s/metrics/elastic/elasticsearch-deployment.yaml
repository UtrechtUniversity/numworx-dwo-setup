apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.28.0 (HEAD)
  creationTimestamp: null
  labels:
    io.kompose.service: elasticsearch
  name: elasticsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: elasticsearch
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.28.0 (HEAD)
      creationTimestamp: null
      labels:
        io.kompose.network/docker-elk-elk: "true"
        io.kompose.service: elasticsearch
    spec:
      containers:
        - env:
            - name: ES_JAVA_OPTS
              value: -Xmx1324m -Xms1324m
          image: docker.elastic.co/elasticsearch/elasticsearch-oss:7.9.3
          name: elasticsearch
          ports:
            - containerPort: 9200
            - containerPort: 9300
          resources: { }
          resources:
            limits:
              memory: 2000Mi
            requests:
              memory: 2000Mi
          volumeMounts:
            - mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
              name: elasticsearch-claim0
              subPath: config.properties
              readOnly: true
            - name: "elasticsearch-master"
              mountPath: /usr/share/elasticsearch/data
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
      volumes:
        - name: elasticsearch-claim0
          configMap:
            name: elasticsearch-config
        - name: elasticsearch-master
          persistentVolumeClaim:
            claimName: elasticsearch-data

status: {}
