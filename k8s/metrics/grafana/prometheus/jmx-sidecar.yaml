apiVersion: apps/v1
kind: Deployment
metadata:
  name: dwoproject
spec:
  template:
    metadata:
      annotations:
        "prometheus.io/scrape": "true"
        "prometheus.io/port": "8080"
    spec:
      containers:
        - name: jmx-exporter
          image: bitnami/jmx-exporter:latest
          ports:
            - containerPort: 8080
          args:
            - "8080"
            - "/config.yaml"
          volumeMounts:
            - mountPath: /config.yaml
              name: jmx-config
              subPath: config.yaml
      volumes:
        - name: jmx-config
          configMap: 
            name: jmx-sidecar-config
            items:
              - key: config.yaml
                path: config.yaml
