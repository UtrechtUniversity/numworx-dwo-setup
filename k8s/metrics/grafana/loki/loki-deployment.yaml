apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: loki
  name: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: loki
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        io.kompose.service: loki
      annotations:
        "prometheus.io/scrape": "true"
        "prometheus.io/port": "3100"
    spec:
      containers:
        - image: grafana/loki:3.6.0
          name: loki
          volumeMounts:
          - name: loki-config
            mountPath: /etc/loki/local-config.yaml
            subPath: loki-config.yaml
          ports:
            - containerPort: 3100
          resources: {}
      restartPolicy: Always
      volumes:
      - name: loki-config
        configMap:
          name: loki-config
status: {}
