apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: lrs
  name: lrs
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: lrs
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        io.kompose.service: lrs
    spec:
      containers:
      - args:
        - /lrsql/bin/run_postgres.sh
        env:
        - name: LRSQL_ADMIN_PASS_DEFAULT
          value: my_password
        - name: LRSQL_ADMIN_USER_DEFAULT
          value: my_username
        - name: LRSQL_ALLOW_ALL_ORIGINS
          value: "true"
        - name: LRSQL_API_KEY_DEFAULT
          value: my_key
        - name: LRSQL_API_SECRET_DEFAULT
          value: my_secret
        - name: LRSQL_DB_HOST
          value: postgres
        - name: LRSQL_DB_NAME
          value: lrsql_db
        - name: LRSQL_DB_PASSWORD
          value: lrsql_password
        - name: LRSQL_DB_USER
          value: lrsql_user
        - name: LRSQL_ENABLE_CLAMAV
          value: "false"
        - name: LRSQL_POOL_INITIALIZATION_FAIL_TIMEOUT
          value: "10000"
        image: yetanalytics/lrsql:latest
        imagePullPolicy: "IfNotPresent"
        name: lrs
        ports:
        - containerPort: 8080
      restartPolicy: Always
status: {}
