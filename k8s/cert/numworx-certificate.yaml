apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: numworx-cert
  namespace: numworx
spec:
  dnsNames:
    - app.numworx
    - cds.numworx
    - www.numworx
    - lrs.numworx
    - chat.numworx
    - hub.numworx
    - register.numworx
  secretName: numworx-cert-tls
  issuerRef:
    name: letsencrypt-staging
