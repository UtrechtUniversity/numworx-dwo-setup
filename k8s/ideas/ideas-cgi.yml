apiVersion: apps/v1
kind: Deployment
metadata:
  name: ideas-cgi-deployment
  labels:
    app: ideas-cgi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ideas-cgi
  template:
    metadata:
      labels:
        app: ideas-cgi
    spec:
      initContainers:
          - name: qemu
            image: 'tonistiigi/binfmt:latest'
            args:
              - '--install'
              - amd64
            imagePullPolicy: Always
            securityContext:
              privileged: true
      containers:
      - name: ideas-cgi
        image: agerdes/ideas-cgi@sha256:251281204e4db31ef2cca8a986c21216b7eacd46293ecef7def925c5b3f33753
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ideas
spec:
  selector:
    app: ideas-cgi
  ports:
    - protocol: TCP
      port: 80      # De poort waarop de service binnen het cluster luistert
      targetPort: 80  # De poort van de container zelf

