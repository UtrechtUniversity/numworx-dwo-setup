apiVersion: apps/v1
kind: Deployment
metadata:
  name: ideas-cgi-deployment
  labels:
    app: ideas-cgi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ideas-cgi
  template:
    metadata:
      labels:
        app: ideas-cgi
    spec:
      containers:
      - name: ideas-cgi
        image: agerdes/ideas-cgi:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ideas-cgi-service
spec:
  selector:
    app: ideas-cgi
  ports:
    - protocol: TCP
      port: 80      # De poort waarop de service binnen het cluster luistert
      targetPort: 80  # De poort van de container zelf

