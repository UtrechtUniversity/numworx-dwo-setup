---
apiVersion: batch/v1
kind: Job
metadata:
  name: maintenancejob
spec:
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: ghcr
      containers:
        - name: maintenance
          image: ghcr.io/utrechtuniversity/numworx-dwo-setup/maintenance
          env:
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: gc_password
            - name: USERNAME
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: gc_username
  backoffLimit: 2
