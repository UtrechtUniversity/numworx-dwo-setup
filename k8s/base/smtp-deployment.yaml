apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: smtp
  name: smtp
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: smtp
  strategy: {}
  template:
    metadata:
      labels:
        io.kompose.service: smtp
    spec:
      imagePullSecrets:
      - name: ghcr
      containers:
        - image: ghcr.io/utrechtuniversity/numworx-dwo-setup/smtp:latest
          imagePullPolicy: IfNotPresent
          name: smtp
          ports:
            - containerPort: 25
          resources: {}
      restartPolicy: Always
status: {}
